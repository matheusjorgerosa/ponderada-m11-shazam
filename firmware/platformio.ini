[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
framework = espidf

; 2 MB de app: o banco de fingerprints da Fase 2 nao cabe no 1 MB padrao.
board_build.partitions = partitions.csv

; Sem isso o PlatformIO cai na /dev/ttyS0 (porta COM legada, nao existe de
; fato) quando o ESP32 nao esta plugado, e o erro fica confuso.
upload_port  = /dev/ttyUSB*
monitor_port = /dev/ttyUSB*

; Mantenha igual a params.json -> serial.baud
monitor_speed  = 921600
upload_speed   = 921600
monitor_filters = direct

build_flags =
    -Wall
